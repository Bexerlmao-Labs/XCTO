# ============================================================
# XCTO Docker Compose（前端 + 后端 + Redis 分离部署）
# 说明：PostgreSQL 不随本 compose 启动，由 script/docker-compose.database.yml
#       创建的外部网络 postgresql-net 提供，backend 通过容器名 postgres 访问。
#       Redis 使用默认账号（default 无密码），仅监听本机回环。
# ============================================================

services:
  redis:
    image: redis:8.10.2
    container_name: redis
    restart: on-failure
    # 开启 AOF 持久化 + 密码认证（默认账号 default，密码见 .env 的 REDIS_PASSWORD）
    command:
      - redis-server
      - --appendonly
      - yes
      - --requirepass
      - "${REDIS_PASSWORD:-redis123456}"
    environment:
      TZ: Asia/Shanghai
      # 供容器内 healthcheck 使用
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123456}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - postgresql-net

  xcto-backend:
    image: xcto-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xcto-backend
    # 反向代理已改为外部手动配置，如需直连后端调试可放开端口
    # ports:
    #   - "8081:65535"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:5432/${DB_NAME:-xcto}?useUnicode=true&characterEncoding=utf8&stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: "${REDIS_PORT:-6379}"
      SPRING_DATA_REDIS_USERNAME: ${REDIS_USER:-default}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123456}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  xcto-frontend:
    image: xcto-frontend:latest
    build:
      context: ./xcto-ui
      dockerfile: Dockerfile
    container_name: xcto-frontend
    # 仅托管 SPA 静态资源；反向代理由外部手动配置，此端口即上游地址
    ports:
      - "8080:80"
    depends_on:
      - xcto-backend
    restart: unless-stopped

# 数据库编排（script/docker-compose.database.yml）创建的外部网络，backend 通过容器名 postgres 访问数据库
networks:
  postgresql-net:
    external: true
    name: postgresql-net

volumes:
  redis-data:
