# ============================================================
# XCTO Docker Compose（NAS 部署）
#
# 部署位置：NAS /vol1/1000/application/xcto/（本文件 + .env）
# 静态资源：前端 dist 由 CI 发布到 /vol1/1000/www/xcto/dist，
#           由 nas-nginx（host 网络）托管，见 deploy/nginx/xcto.conf
#
# 与 ECS 时代的差异：
#   - PostgreSQL 不再复用外部容器编排——NAS 上 postgres 容器（postgres:18.6）
#     已独立部署，挂在外部网络 postgresql-net，别名 postgres，
#     本编排直接复用，不再创建数据库容器
#   - Redis 独立容器 xcto-redis，不映射宿主机端口
#   - 后端映射 127.0.0.1:8081 供 nas-nginx（host 网络）反代 /api
#   - 前端不打镜像、不进编排：CI 编译 dist 后直接发布到宿主机 webroot
#
# 首次初始化数据库（本次迁移已手工完成，留作记录）：
#   docker exec -i postgres psql -U Bexerlmao -d xcto < db/init/01-create-tables.sql
#
# 敏感信息在 /vol1/1000/application/xcto/.env 中配置：
#   POSTGRES_USER=Bexerlmao
#   POSTGRES_PASSWORD=xxx
#   REDIS_PASSWORD=xxx
#   XCTO_INVITE_CODE=xxx   # 注册邀请码，不设置则注册未开放
# ============================================================

services:
  xcto-redis:
    image: redis:8.10.2
    container_name: xcto-redis
    restart: unless-stopped
    # 开启 AOF 持久化 + 密码认证（默认账号 default）
    command:
      - redis-server
      - --appendonly
      - yes
      - --requirepass
      - "${REDIS_PASSWORD:-redis123456}"
      - --user
      - "${REDIS_USER:-default}"
      - "on"
      - ">${REDIS_PASSWORD:-redis123456}"
      - "~*"
      - "&*"
      - "+@all"
    environment:
      TZ: Asia/Shanghai
      REDIS_USER: ${REDIS_USER:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123456}
    # 不映射宿主机端口：backend 走 compose 内部网络以服务名访问
    volumes:
      - xcto-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postgresql-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  xcto-backend:
    # 必须写 TCR 全名：docker compose pull 才能从 TCR 拉取 Jenkins 推送的镜像
    image: ccr.ccs.tencentyun.com/xcto/xcto-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xcto-backend
    restart: unless-stopped
    # 后端不直接暴露公网；nas-nginx（host 网络）按 /api 前缀反代到 127.0.0.1:8081
    ports:
      - "127.0.0.1:8081:65535"
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      # postgres = NAS 现有 postgres 容器在 postgresql-net 网络中的别名
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:5432/${DB_NAME:-xcto}?useUnicode=true&characterEncoding=utf8&stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-Bexerlmao}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: xcto-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_USERNAME: default
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123456}
      # 注册邀请码（.env 中配置 XCTO_INVITE_CODE=xxx）
      XCTO_INVITE_CODE: ${XCTO_INVITE_CODE:-}
    depends_on:
      xcto-redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - postgresql-net

# 复用 NAS 上 postgres 容器所在的外部网络（postgres 容器别名 postgres）
networks:
  postgresql-net:
    external: true
    name: postgresql-net

volumes:
  xcto-redis-data:
