name: Build & Deploy

# 合并到 main（即 push 到 main）后触发
on:
  push:
    branches: [ main ]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

env:
  # 腾讯云 TCR 经典个人版地址（腾讯云 ECS 拉取自动走内网）
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  # 前端不再打镜像：CI 编译 dist 后发布到 ECS webroot，由宿主机 nginx 托管
  BACKEND_IMAGE: ccr.ccs.tencentyun.com/xcto/xcto-backend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 后端 jar 不含前端；script 模块是 pom 空壳无需跳过
      # -s 指定阿里云镜像：Maven Central 会对 Actions 共享出口 IP 限流（429）
      - name: Build with Maven
        run: mvn -B -s .github/maven-settings.xml clean package -DskipTests -Dskip.frontend=true

      # ---------- 前端：CI 直接编译，产物发布到 ECS webroot ----------
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: xcto-ui/package-lock.json

      - name: Build frontend
        run: cd xcto-ui && npm ci && npm run build-only

      # ---------- 构建并推送镜像 ----------
      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 关闭 attestation（provenance/SBOM）：TCR 个人版对这类清单支持不佳，会导致推送阶段反复重试、
          # 日志卡在 resolving provenance for metadata file 很久
          provenance: false
          sbom: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # ---------- 前端静态产物发布到 ECS webroot（宿主机 nginx 托管） ----------
      - name: Clear ECS frontend webroot
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT || 22 }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          timeout: 30s
          script_stop: true
          script: |
            # 清空旧产物（带内容哈希的 assets 会随版本累积），再由下面一步上传新产物
            rm -rf /www/dk_project/wwwroot/xcto.bexerlmao.cc/*

      - name: Upload frontend dist to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT || 22 }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "xcto-ui/dist/*"
          target: "/www/dk_project/wwwroot/xcto.bexerlmao.cc"
          strip_components: 2

      # ---------- 部署到 ECS ----------
      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1.2.0
        env:
          # 传给远端脚本用于 docker login（GitHub 会自动在日志中打码 secret）
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        with:
          host: ${{ secrets.ECS_HOST }}
          # ECS 的 sshd 端口（在仓库 Settings → Secrets 里配置 ECS_PORT；未配置时回落 22）
          port: ${{ secrets.ECS_PORT || 22 }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          # SSH 连接建立超时（默认 30s）
          timeout: 30s
          # 远程命令执行超时：镜像拉取较慢，放宽到 30 分钟（注意：该参数是 command_timeout，而非 timeout）
          command_timeout: 30m
          # 把上面 env 里定义的变量传给远端脚本
          envs: TCR_USERNAME,TCR_PASSWORD
          # 任一命令失败（非 0 退出码）即中止后续命令，避免误判部署成功
          script_stop: true
          script: |
            cd /opt/xcto
            # 拉取前先登录 TCR（服务器 daemon 没有长期凭证，每次部署时登录一次；
            # --password-stdin 避免密码出现在进程列表/历史里）
            echo "$TCR_PASSWORD" | docker login ${{ env.TCR_REGISTRY }} --username "$TCR_USERNAME" --password-stdin
            # 只拉取自建镜像；database/redis 用服务器本地镜像（docker compose pull 不带参数会连 Docker Hub，
            # 本地 postgres/redis 与远端 digest 不一致会被判为有更新，每次重新下几百 MB 导致超时）
            docker compose pull xcto-backend
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Deployment summary
        run: echo "✅ 已部署 commit ${{ github.sha }} 到 ECS"
