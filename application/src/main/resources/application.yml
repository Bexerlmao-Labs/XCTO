# ============================================================
# 通用配置（三个环境共用）
# 环境专属配置在 application-dev.yml / application-prod.yml
# 默认激活 dev；生产由 docker compose 注入 SPRING_PROFILES_ACTIVE=prod 覆盖
# ============================================================
spring:
  application:
    name: Application
  profiles:
    active: dev

server:
  port: 65535
  error:
    include-message: always
    include-exception: true

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-header: true
  is-read-cookie: true
  is-log: false

logging:
  level:
    cc.bexerlmao.xcto: DEBUG
    org.springframework.web.servlet.mvc: DEBUG
    org.springframework.web.servlet.handler: DEBUG
