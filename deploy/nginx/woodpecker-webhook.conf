# Woodpecker webhook 公网入口（仅放行 webhook，UI 一律拒绝）
# 监听 19000：frpc 的 woodpecker 隧道（VPS 19000 → NAS 19000）落在这里
# UI 正常从内网访问 http://10.8.0.2:9000，不经此文件

server {
    listen 19000;
    listen [::]:19000;
    server_name _;

    access_log /var/log/nginx/woodpecker-webhook.log;
    error_log  /var/log/nginx/woodpecker-webhook.error.log;

    # 只放行 GitHub webhook
    location = /api/webhook/github {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # GitHub payload 可能较大（push diff）
        client_max_body_size 50m;
    }

    # 其余一切（UI、API、healthz）拒绝
    location / {
        return 403;
    }
}
