# ============================================================
# [参考文件，未启用] VPS 侧反代 — 请自行配置到宝塔
#
# 目标：公网 http://xcto.bexerlmao.cc → NAS nginx（纯 HTTP，无证书）
# 通道：WG 主（10.8.0.2:80），frp 备（127.0.0.1:16080，
#       对应 NAS frpc 需新增 proxy：localPort 80 / remotePort 16080）
#
# 用法（二选一）：
#   a. 宝塔面板把现有 xcto.bexerlmao.cc 站点改为纯反代（删除静态 root，
#      / 和 /api 都指向 upstream），并去掉 /api → 127.0.0.1:8081 的旧后端
#   b. 直接替换 /www/server/panel/vhost/nginx/xcto.bexerlmao.cc.conf 后
#      nginx -t && nginx -s reload
#
# 同时记得下线 VPS 上的旧容器：docker stop xcto-backend xcto-redis
# ============================================================

# ---------- /www/server/panel/vhost/nginx/xcto.bexerlmao.cc.conf ----------

# 上游双通道：WG 主，frp 备（WG 连续失败 30 秒内自动切 frp）
upstream xcto_backend {
    server 10.8.0.2:80 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:16080 backup;
}

server {
    listen 80;
    listen [::]:80;
    server_name xcto.bexerlmao.cc;

    access_log /www/wwwlogs/xcto.bexerlmao.cc.log;
    error_log  /www/wwwlogs/xcto.bexerlmao.cc.error.log;

    # 保留宝塔的证书验证 include（无害；纯 HTTP 不再申请证书）
    # include /www/server/panel/vhost/nginx/well-known/xcto.bexerlmao.cc.conf;

    location / {
        proxy_pass http://xcto_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
