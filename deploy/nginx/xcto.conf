# xcto.bexerlmao.cc — XCTO 刷题站（纯 HTTP，TLS 由 VPS 反代层可选处理）
# 部署位置：NAS /vol1/1000/application/nginx/conf/xcto.conf（nas-nginx，host 网络）
#
# 前端：CI 发布到 /vol1/1000/www/xcto/dist，由本文件直接托管
#       （nas-nginx 已挂载 /vol1/1000/www → /usr/share/nginx/www）
# 后端：/api 前缀转发到 xcto-backend（127.0.0.1:8081），转发时剥掉 /api
# 公网：VPS nginx 将 xcto.bexerlmao.cc 反代到本机 80（WG 主 + frp 备）

server {
    listen 80;
    listen [::]:80;
    server_name xcto.bexerlmao.cc;

    access_log /var/log/nginx/xcto.bexerlmao.cc.log;
    error_log  /var/log/nginx/xcto.bexerlmao.cc.error.log;

    # Vue Router history 模式：静态文件不存在时回落 index.html
    root /usr/share/nginx/www/xcto/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（文件名带哈希，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /api 转发到后端容器，转发时剥掉 /api 前缀（trailing slash）
    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
